name: Build and Publish DubLift

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: al3ss107/dublift
  UPSTREAM_REPO: joojoooo/DubLift

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      build: ${{ steps.check_image.outputs.build }}

    steps:
      - name: Get upstream SHA
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api \
            repos/${{ env.UPSTREAM_REPO }}/commits/main \
            --jq '.sha')

          echo "Upstream SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check_image
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}"

          echo "Checking: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image already exists."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.build == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docker repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          build-args: |
            DUBLIFT_SHA=${{ needs.check.outputs.sha }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
