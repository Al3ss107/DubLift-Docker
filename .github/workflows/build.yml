name: Build and Publish DubLift

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: al3ss107/dublift
  UPSTREAM_REPO: joojoooo/DubLift

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      build: ${{ steps.check_build.outputs.build }}

    steps:
      - name: Checkout Docker repository
        uses: actions/checkout@v6

      - name: Get upstream SHA
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api \
            repos/${{ env.UPSTREAM_REPO }}/commits/main \
            --jq '.sha')

          echo "Upstream SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Calculate Dockerfile hash
        id: dockerfile
        run: |
          HASH=$(sha256sum Dockerfile | cut -d' ' -f1)

          echo "Dockerfile SHA256: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if upstream image already exists
        id: check_image
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}"

          echo "Checking: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Dockerfile hash
        id: check_dockerfile
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          DOCKERFILE_HASH: ${{ steps.dockerfile.outputs.hash }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}"

          echo "Checking Dockerfile revision for:"
          echo "$IMAGE"

          if [ "${{ steps.check_image.outputs.exists }}" != "true" ]; then
            echo "Image does not exist."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Image exists."

          # Recupera i metadata dell'immagine.
          docker pull "$IMAGE" > /dev/null

          LABEL_HASH=$(docker inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.dockerfile.hash" }}' \
            2>/dev/null || true)

          echo "Current Dockerfile hash: $DOCKERFILE_HASH"
          echo "Image Dockerfile hash:   ${LABEL_HASH:-<none>}"

          if [ "$LABEL_HASH" != "$DOCKERFILE_HASH" ]; then
            echo "Dockerfile changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile unchanged."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: check_build
        env:
          IMAGE_EXISTS: ${{ steps.check_image.outputs.exists }}
          DOCKERFILE_BUILD: ${{ steps.check_dockerfile.outputs.build }}
        run: |
          if [ "$IMAGE_EXISTS" != "true" ]; then
            echo "No image for this upstream SHA."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOCKERFILE_BUILD" = "true" ]; then
            echo "Dockerfile changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build and publish
    needs: check

    if: needs.check.outputs.build == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docker repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Dockerfile hash
        id: dockerfile
        run: |
          HASH=$(sha256sum Dockerfile | cut -d' ' -f1)

          echo "Dockerfile SHA256: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          build-args: |
            DUBLIFT_SHA=${{ needs.check.outputs.sha }}

          labels: |
            org.opencontainers.image.dockerfile.hash=${{ steps.dockerfile.outputs.hash }}
            org.opencontainers.image.source=https://github.com/joojoooo/DubLift

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
```
